services:
  agentb-1:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  agentb-2:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  agentb-3:
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  agentb-rag-worker:
    depends_on:
      redis:
        condition: service_healthy

  agentb-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTB_PORT:-8152}:8080"
    volumes:
      - ./deploy/nginx/agentb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agentb-1:
        condition: service_healthy
      agentb-2:
        condition: service_healthy
      agentb-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/router-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - agentb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentb}
      MYSQL_USER: ${MYSQL_USER:-agentb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
    volumes:
      - agentb-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  agentb-redis-data:
  agentb-mysql-data:
