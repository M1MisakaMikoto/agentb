# API Registry - API 注册表
# 手动维护，新增 API 时登记
# 用于静态验证测试代码的正确性

apis:
  session:
    create:
      path: "/session/sessions"
      method: "POST"
      param_types: {}
      description: "创建会话"
    get:
      path: "/session/sessions/{session_id}"
      method: "GET"
      param_types:
        session_id: "int"
      description: "获取会话详情"
    list:
      path: "/session/sessions"
      method: "GET"
      param_types: {}
      description: "列出所有会话"
    generate_title:
      path: "/session/sessions/{session_id}/title:generate"
      method: "POST"
      param_types:
        session_id: "int"
      description: "生成会话标题"

  conversation:
    create:
      path: "/session/sessions/{session_id}/conversations"
      method: "POST"
      param_types:
        session_id: "int"
      description: "创建对话"
    get:
      path: "/session/conversations/{conversation_id}"
      method: "GET"
      param_types:
        conversation_id: "str"
      description: "获取对话详情"
    stream:
      path: "/session/conversations/{conversation_id}/stream"
      method: "GET"
      param_types:
        conversation_id: "str"
      description: "流式获取对话响应"
    cancel:
      path: "/session/conversations/{conversation_id}/cancel"
      method: "POST"
      param_types:
        conversation_id: "str"
      description: "取消对话"

  workspace:
    get:
      path: "/workspaces/{workspace_id}"
      method: "GET"
      param_types:
        workspace_id: "str"
      description: "获取工作区详情"
    list_files:
      path: "/workspaces/{workspace_id}/files"
      method: "GET"
      param_types:
        workspace_id: "str"
      description: "列出工作区文件"
    upload_file:
      path: "/workspaces/{workspace_id}/files"
      method: "POST"
      param_types:
        workspace_id: "str"
      description: "上传文件到工作区"

  plan:
    get:
      path: "/plan/{workspace_id}"
      method: "GET"
      param_types:
        workspace_id: "str"
      description: "获取计划内容"
    status:
      path: "/plan/{workspace_id}/status"
      method: "GET"
      param_types:
        workspace_id: "str"
      description: "获取计划状态"
    update:
      path: "/plan/update"
      method: "POST"
      param_types:
        workspace_id: "str"
      description: "更新计划内容"
    approve:
      path: "/plan/update"
      method: "POST"
      param_types:
        workspace_id: "str"
      description: "审批计划"
