api:
  base_url: "http://127.0.0.1:8000"
  host: "127.0.0.1"
  port: 8000
  endpoints:
    session:
      create: "/session/sessions"
      get: "/session/sessions/{session_id}"
      list: "/session/sessions"
      generate_title: "/session/sessions/{session_id}/title:generate"
    conversation:
      create: "/session/sessions/{session_id}/conversations"
      get: "/session/conversations/{conversation_id}"
      stream: "/session/conversations/{conversation_id}/stream"
      cancel: "/session/conversations/{conversation_id}/cancel"
    workspace:
      get: "/workspaces/{workspace_id}"
      list_files: "/workspaces/{workspace_id}/files"
      upload_file: "/workspaces/{workspace_id}/files"
    plan:
      get: "/plan/{workspace_id}"
      status: "/plan/{workspace_id}/status"
      update: "/plan/update"
      approve: "/plan/update"

suites:
  basic:
    description: "Basic tests"
    scenarios:
      - direct_mode
      - search_mode
  
  tools:
    description: "Tool tests"
    scenarios:
      - rag_search
      - sql_query
  
  all:
    description: "All tests"
    scenarios:
      - direct_mode
      - plan_mode
      - search_mode
      - serial_mode
      - rag_search
      - sql_query
      - bridge_predict
      - bridge_defect_extract
      - disaster_judgment_flow

scenarios:
  direct_mode:
    description: "DIRECT mode test"
  
  plan_mode:
    description: "PLAN mode test"
  
  search_mode:
    description: "SEARCH mode test"
  
  serial_mode:
    description: "SERIAL mode test"
  
  rag_search:
    description: "RAG search test"
    test_documents:
      - title: "产品使用手册"
        category: "技术文档"
        content: "这是产品使用手册的内容，包含产品的基本操作指南、常见问题解答和技术规格说明。"
      - title: "销售报告 2024"
        category: "业务报告"
        content: "2024年销售报告显示，公司整体销售额增长了15%，其中新产品线贡献了30%的增长。"
      - title: "员工培训手册"
        category: "人力资源"
        content: "员工培训手册包含公司文化、规章制度、工作流程和职业发展指南。"
  
  sql_query:
    description: "SQL query test"

  sql_tool_test:
    description: "SQL Tool Call Test"
    timeout: 120.0
    prompt: "请帮我执行以下 SQL 查询，查看数据库中有哪些表。使用 sql_query 工具查询 show_databases 和 show_tables。"

  workspace_upload_read_document:
    description: "Workspace Upload - Read Document Test"
    source_files:
      - ".dev/table/桥梁检测报告/2020/07 朝阳寺立交桥.doc"
    prompt: "请仔细分析工作区中的桥梁检测报告文档，提取所有病害信息。需要提取的病害数据包括：1) 上部结构病害: 梁体裂缝、破损、露筋等 2) 下部结构病害: 桥墩裂缝、破损等 3) 桥面系病害: 桥面铺装裂缝、破损等 4) 支座病害。请以结构化格式输出，最后给出病害统计。"

  bridge_predict:
    description: "Bridge Inspection Report - Historical Data Prediction Test"
    prediction_timeout: 900.0
    prompt: |
      基于工作区中的{historical_years}{bridge_name}历史检测报告，使用call_prediction_agent工具预测并生成{next_year}年的完整检测报告（Word文档格式）。

      报告文件名: {next_year}年桥梁检测报告预测.docx
      报告应包含: 工程概况、规范依据、检测结果、BCI评定、趋势预测、结论建议等完整章节

  bridge_defect_extract:
    description: "Bridge Defect Extraction - 从朝阳寺立交桥2020检测报告中提取病害数据"
    source_files:
      - ".dev/table/桥梁检测报告/2020/07 朝阳寺立交桥.doc"
    extraction_timeout: 600.0
    prompt: |
      请仔细分析工作区中的桥梁检测报告文档，提取所有病害信息。

      需要提取的病害数据包括：
      1. **上部结构病害**: 梁体裂缝、破损、露筋、蜂窝麻面等
      2. **下部结构病害**: 桥墩裂缝、破损、冲刷等
      3. **桥面系病害**: 桥面铺装裂缝、破损、伸缩缝损坏、护栏损坏等
      4. **支座病害**: 支座脱空、变形、损坏等

      请以结构化的格式输出，分类整理每类病害的具体位置、类型、严重程度等信息。
      如果报告中没有某类病害，请标注"未发现"。

      最后请给出：
      1. 病害总数统计
      2. 主要病害类型分布
      3. 整体状况评估

  bridge_decision_test:
    description: "桥梁病害智能决策测试 - 分析 → 研判提交 → 决策报告 → 报告提交"
    judgment_timeout: 900.0

  disaster_judgment:
    description: "Disaster Judgment Flow - AI识别 → 发现问题 → 决策 → 报告推送"

  bridge_disease_extract:
    description: "Bridge Disease Extraction - 从检测报告中提取病害信息"
    extraction_timeout: 600.0
    prompt: |
      请仔细分析工作区中的桥梁检测报告文档，提取所有病害信息。

      请按以下格式输出每个病害的详细信息：

      **病害 #{编号}**
      - **类型**: [病害类型，如：裂缝、剥落、锈蚀、变形等]
      - **位置**: [具体位置描述，如：第X跨、X号墩、桥面等]
      - **严重程度/等级**: [如：A级/B级/C级/D级/E级 或 轻度/中度/重度]
      - **尺寸/范围**: [长度、宽度、面积等量化数据]
      - **处置建议**: [针对该病害的维修或处置建议]

      最后请给出：
      1. 病害总数统计
      2. 主要病害类型分布
      3. 整体状况评估

      请确保信息完整准确，不要遗漏任何病害记录。
