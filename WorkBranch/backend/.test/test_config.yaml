# E2E Test Configuration
# 测试配置：API端点、测试套件、场景参数

api:
  base_url: "http://127.0.0.1:8000"
  host: "127.0.0.1"
  port: 8000
  timeout:
    connect: 30.0
    read: 300.0
    write: 300.0
    pool: 300.0
  endpoints:
    session:
      create: "/session/sessions"
      get: "/session/sessions/{session_id}"
      list: "/session/sessions"
      generate_title: "/session/sessions/{session_id}/title:generate"
    conversation:
      create: "/session/sessions/{session_id}/conversations"
      get: "/session/conversations/{conversation_id}"
      stream: "/session/conversations/{conversation_id}/stream"
      cancel: "/session/conversations/{conversation_id}/cancel"
    workspace:
      get: "/workspaces/{workspace_id}"
      list_files: "/workspaces/{workspace_id}/files"
      upload_file: "/workspaces/{workspace_id}/files"
    plan:
      get: "/plan/{workspace_id}"
      status: "/plan/{workspace_id}/status"
      update: "/plan/update"
      approve: "/plan/update"

suites:
  qiaozitang:
    description: "桥梓塘立交1-5月跨报告聚合查询"
    scenarios:
      - qiaozitang_monthly_query
  all:
    description: "全部场景（当前仅桥梓塘月度查询）"
    scenarios:
      - qiaozitang_monthly_query

scenarios:
  qiaozitang_monthly_query:
    description: "桥梓塘立交1-5月跨5份巡查报告聚合查询"
    source_files:
      - ".dev/table/桥梁检测报告4/大渡口1月巡查报告.docx"
      - ".dev/table/桥梁检测报告4/大渡口2月巡查报告.docx"
      - ".dev/table/桥梁检测报告4/大渡口3月巡查报告.docx"
      - ".dev/table/桥梁检测报告4/大渡口4月巡查报告.docx"
      - ".dev/table/桥梁检测报告4/大渡口5月巡查报告.docx"
    prompt: "查询桥梓塘立交1-5月的数据"
    extraction_timeout: 300.0
