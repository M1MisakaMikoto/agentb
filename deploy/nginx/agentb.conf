map $http_x_agentb_affinity_key $agentb_affinity_key {
    default $http_x_agentb_affinity_key;
    "" $arg_affinity_key;
}

map "$request_method:$uri" $agentb_affinity_required {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/api/session/conversations/ 1;
    ~^GET:/api/session/conversations/.+/stream$ 1;
    ~^(POST|PUT|PATCH|DELETE):/api/session/sessions 1;
}

map $agentb_affinity_key $agentb_affinity_missing {
    default 0;
    "" 1;
}

map "$agentb_affinity_required:$agentb_affinity_missing" $agentb_reject_missing_affinity {
    default 0;
    "1:1" 1;
}

upstream agentb_workers {
    hash $agentb_affinity_key consistent;
    server agentb-1:8000 max_fails=2 fail_timeout=10s;
    server agentb-2:8000 max_fails=2 fail_timeout=10s;
    server agentb-3:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    location = /router-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        if ($agentb_reject_missing_affinity) { return 400; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://agentb_workers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-AgentB-Affinity-Key $agentb_affinity_key;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://agentb_workers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-AgentB-Affinity-Key $agentb_affinity_key;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
