<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentB 调试控制台</title>
  <style>
    :root { color-scheme: dark; font-family: Consolas, "Microsoft YaHei", monospace; background: #111315; color: #e8eaed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #34383d; background: #191c1f; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .connection { color: #9aa0a6; font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
    aside { padding: 16px; border-right: 1px solid #34383d; background: #151719; }
    section { padding: 16px 20px; min-width: 0; }
    h2 { margin: 0 0 10px; font-size: 13px; color: #bdc1c6; text-transform: uppercase; letter-spacing: 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    button { min-height: 38px; border: 1px solid #454b52; border-radius: 4px; background: #24282c; color: #f1f3f4; padding: 8px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: #30353a; border-color: #7c838b; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: #176b44; border-color: #24875b; }
    button.danger { background: #642b2b; border-color: #934040; }
    button.wide { grid-column: 1 / -1; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .toolbar button { min-height: 32px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    th, td { text-align: left; border-bottom: 1px solid #34383d; padding: 9px 8px; overflow-wrap: anywhere; }
    th { color: #9aa0a6; font-weight: 600; }
    .state-running, .state-healthy { color: #55d38a; }
    .state-starting { color: #f2c14e; }
    .state-exited, .state-unhealthy { color: #ff7676; }
    .meta { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 10px; color: #9aa0a6; font-size: 12px; }
    pre { margin: 0; height: min(52vh, 620px); overflow: auto; border: 1px solid #34383d; border-radius: 4px; background: #0b0d0f; color: #dfe3e7; padding: 12px; font: 12px/1.55 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .error { color: #ff7676; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #34383d; }
      pre { height: 48vh; }
    }
  </style>
</head>
<body data-token="__DEBUG_TOKEN__">
  <header>
    <h1>AgentB 调试控制台</h1>
    <div id="connection" class="connection">正在连接</div>
  </header>
  <main>
    <aside>
      <h2>顺序启动</h2>
      <div class="actions">
        <button data-action="start-deps">MySQL + Redis</button>
        <button data-action="start-agentb-1">API Worker 1</button>
        <button data-action="start-agentb-2">API Worker 2</button>
        <button data-action="start-agentb-3">API Worker 3</button>
        <button data-action="start-rag">RAG Worker</button>
        <button data-action="start-router">Nginx Router</button>
      </div>
      <h2>集合操作</h2>
      <div class="actions">
        <button class="primary wide" data-action="start-stack">启动整栈</button>
        <button class="wide" data-action="build-start">构建并启动</button>
        <button class="wide" data-action="regression">运行 16 场景回归</button>
        <button data-action="compose-logs">采集日志</button>
        <button class="danger" data-action="stop-stack">停止整栈</button>
        <button id="cancel" class="danger wide">取消当前任务</button>
      </div>
    </aside>
    <section>
      <div class="toolbar"><button id="refresh">刷新服务状态</button></div>
      <table>
        <thead><tr><th>服务</th><th>状态</th><th>健康</th><th>容器</th></tr></thead>
        <tbody id="services"><tr><td colspan="4">暂无状态</td></tr></tbody>
      </table>
      <h2 style="margin-top: 22px">任务日志</h2>
      <div id="job-meta" class="meta"><span>尚未运行任务</span></div>
      <pre id="log">等待操作</pre>
    </section>
  </main>
  <script src="/debug_console.js"></script>
</body>
</html>
